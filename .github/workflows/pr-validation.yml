name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize  # Triggers automatically on every push/commit to the pull request
      - reopened

# Cancel obsolete in-flight runs if newer commits are pushed to the same pull request
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant executable permissions
        run: |
          chmod +x scripts/linux/*.sh
          find . -name "mvnw" -exec chmod +x {} +

      - name: Set up Infrastructure
        run: |
          ./scripts/linux/infrastructure.sh
          sleep 10

      - name: Run All Services and UI Tests
        run: ./scripts/linux/test_local.sh

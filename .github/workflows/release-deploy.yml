name: Deploy release to AWS EKS

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sentientgate-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: sentientgate-eks
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  test:
    name: Test released source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant executable permissions
        run: |
          chmod +x scripts/linux/*.sh
          find . -name "mvnw" -exec chmod +x {} +

      - name: Set up infrastructure
        run: |
          ./scripts/linux/infrastructure.sh
          sleep 10

      - name: Run service and UI tests
        run: ./scripts/linux/test_local.sh

  publish:
    name: Build and publish release images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Validate Docker image tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "GitHub release tag '$RELEASE_TAG' is not a valid Docker image tag." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish release-tagged images
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/linux/*.sh
          ./scripts/linux/build_and_push_images.sh build
          ./scripts/linux/build_and_push_images.sh push "$RELEASE_TAG"

  deploy:
    name: Provision if needed and deploy release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validate required deployment settings
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          API_GATEWAY_SENTINEL_SECRET_KEY: ${{ secrets.API_GATEWAY_SENTINEL_SECRET_KEY }}
          API_GATEWAY_JWT_SECRET_KEY: ${{ secrets.API_GATEWAY_JWT_SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
        run: |
          set -euo pipefail
          for name in \
            AWS_ROLE_ARN \
            API_GATEWAY_SENTINEL_SECRET_KEY \
            API_GATEWAY_JWT_SECRET_KEY \
            POSTGRES_USER \
            POSTGRES_PASSWORD \
            OLLAMA_BASE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub secret or variable is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: SentientGateRelease-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Check for existing EKS cluster before creating AWS resources
        id: cluster
        shell: bash
        run: |
          set -euo pipefail
          if error="$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.name' \
            --output text 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster $EKS_CLUSTER_NAME already exists; skipping Terraform provisioning."
          elif grep -q "ResourceNotFoundException" <<< "$error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster $EKS_CLUSTER_NAME was not found; Terraform will provision it."
          else
            echo "$error" >&2
            exit 1
          fi

      - name: Create or verify Terraform state bucket
        id: backend
        if: steps.cluster.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repo_hash="$(printf '%s' "$GITHUB_REPOSITORY" | sha256sum | cut -c1-8)"
          bucket="sentientgate-tfstate-${account_id}-${repo_hash}"

          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api put-public-access-block \
            --bucket "$bucket" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
          aws s3api put-bucket-encryption \
            --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-bucket-versioning \
            --bucket "$bucket" \
            --versioning-configuration Status=Enabled

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform state
        if: steps.cluster.outputs.exists == 'false'
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_cluster_name: ${{ env.EKS_CLUSTER_NAME }}
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Create AWS infrastructure only when EKS is absent
        if: steps.cluster.outputs.exists == 'false'
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_cluster_name: ${{ env.EKS_CLUSTER_NAME }}
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
        run: terraform apply -input=false -auto-approve

      - name: Confirm infrastructure provisioning was skipped
        if: steps.cluster.outputs.exists == 'true'
        run: echo "Existing EKS cluster found; Terraform was not initialized and no AWS infrastructure was created."

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install Kubernetes add-ons required by the chart
        shell: bash
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace --take-ownership --wait --timeout 10m
          helm upgrade --install keda kedacore/keda \
            --namespace keda --create-namespace --take-ownership --wait --timeout 10m
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system --take-ownership --wait --timeout 10m

      - name: Deploy SentientGate Helm chart
        shell: bash
        env:
          API_GATEWAY_SENTINEL_SECRET_KEY: ${{ secrets.API_GATEWAY_SENTINEL_SECRET_KEY }}
          API_GATEWAY_JWT_SECRET_KEY: ${{ secrets.API_GATEWAY_JWT_SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
        run: |
          set -euo pipefail
          values_override="$(mktemp "$RUNNER_TEMP/sentientgate-values.XXXXXX.json")"
          trap 'rm -f "$values_override"' EXIT

          jq -n \
            --arg ollamaBaseUrl "$OLLAMA_BASE_URL" \
            --arg apiGatewaySentinelSecretKey "$API_GATEWAY_SENTINEL_SECRET_KEY" \
            --arg apiGatewayJwtSecretKey "$API_GATEWAY_JWT_SECRET_KEY" \
            --arg postgresUser "$POSTGRES_USER" \
            --arg postgresPassword "$POSTGRES_PASSWORD" \
            --arg rolloutId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              ollama: {baseUrl: $ollamaBaseUrl},
              secrets: {
                apiGatewaySentinelSecretKey: $apiGatewaySentinelSecretKey,
                apiGatewayJwtSecretKey: $apiGatewayJwtSecretKey,
                postgresUser: $postgresUser,
                postgresPassword: $postgresPassword
              },
              rolloutId: $rolloutId
            }' > "$values_override"

          helm upgrade --install sentientgate ./k8s \
            --namespace sentientgate \
            --create-namespace \
            --take-ownership \
            --values ./k8s/values.yaml \
            --values "$values_override" \
            --set-string "image.tag=$RELEASE_TAG" \
            --wait \
            --timeout 10m

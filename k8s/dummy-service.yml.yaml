apiVersion: v1
kind: ConfigMap
metadata:
  name: dummy-service-config
  namespace: sentientgate
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
  SERVER_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-service
  namespace: sentientgate
  labels:
    app: dummy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-service
  template:
    metadata:
      labels:
        app: dummy-service
    spec:
      containers:
        - name: dummy-service
          image: shrihari7396/dummy-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dummy-service-config
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-service
  namespace: sentientgate
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: dummy-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dummy-service-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dummy-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

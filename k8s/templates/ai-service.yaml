apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: {{ .Release.Namespace }}
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
  OLLAMA_BASE_URL: {{ required "ollama.baseUrl is required" .Values.ollama.baseUrl | quote }}
  SERVER_PORT: "8080"
  OLLAMA_MODEL: "gemma3.2:latest"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: sentientgate
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      annotations:
        sentientgate/release-id: {{ .Values.rolloutId | quote }}
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: {{ printf "%s/ai-service@%s" .Values.image.repository (required "images.aiService.digest is required" .Values.images.aiService.digest) | quote }}
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: ai-service-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: sentientgate
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ai-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

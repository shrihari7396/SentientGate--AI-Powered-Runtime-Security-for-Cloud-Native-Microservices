apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-config
  namespace: {{ .Release.Namespace }}
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mydb"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
  SERVER_PORT: "8080"
  GRPC_SERVER_PORT: "9090"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: sentientgate
  labels:
    app: logging-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      annotations:
        sentientgate/release-id: {{ .Values.rolloutId | quote }}
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: {{ printf "%s/logging-service@%s" .Values.image.repository (required "images.loggingService.digest is required" .Values.images.loggingService.digest) | quote }}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: logging-config
            - secretRef:
                name: logging-secret
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: sentientgate
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
  selector:
    app: logging-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logging-service-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logging-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
